name: Update Build Arsenal Languages

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  push:
    branches:
      - main
    paths:
      - '.github/scripts/update_arsenal.py'
      - '.github/workflows/update-arsenal.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-arsenal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Build Arsenal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 .github/scripts/update_arsenal.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "🤖 chore: update build arsenal languages"
            git push
          else
            echo "No changes in Build Arsenal languages."
          fi
